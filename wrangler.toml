name = "saachii-api"
main = "src/worker.js"
compatibility_date = "2026-10-31"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "saachii-db"
database_id = "REPLACE_WITH_YOUR_CLOUDFLARE_D1_DATABASE_ID"

# Before deploying:
# 1. Create a D1 database named saachii-db in Cloudflare.
# 2. Replace the database_id above with its actual ID.
# 3. Run: npx wrangler d1 execute saachii-db --remote --file=./schema.sql
# 4. Set up origin/CORS allowlisting and rate limiting before production.
# 5. Add MarzPay secrets only after receiving official API documentation and credentials.
